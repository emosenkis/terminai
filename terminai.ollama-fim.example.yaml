# Direct local completion with Qwen2.5-Coder Base's fill-in-middle mode.
# Prerequisites:
#   ollama pull qwen2.5-coder:7b-base
#   ollama serve
#   curl and jq
auto-completion:
  on-hotkey: true
  on-prompt-pause: true
  delay-ms: 250
  agent:
    preset: local-qwen-fim
  agents:
    local-qwen-fim:
      extends: ollama-qwen-fim
      env:
        TERMINAI_OLLAMA_MODEL: qwen2.5-coder:7b-base
        OLLAMA_HOST: http://127.0.0.1:11434
