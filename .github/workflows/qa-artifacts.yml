name: QA Build Artifacts
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  snapshot-tests:
    name: Terminal snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install terminal emulators
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          curl -fsSLO https://github.com/zellij-org/zellij/releases/download/v0.44.3/zellij-x86_64-unknown-linux-musl.tar.gz
          echo "0f7c346788627f506c0a28296517768633cff24fc822a739f8264b640ecad751  zellij-x86_64-unknown-linux-musl.tar.gz" | sha256sum -c -
          sudo tar -xzf zellij-x86_64-unknown-linux-musl.tar.gz -C /usr/local/bin
      - name: Run terminal snapshots
        run: >-
          TERMINAI_SNAPSHOT_EMULATORS=internal,tmux,zellij,ghostty-vt
          cargo test -p termin --features ghostty-snapshot-tests
          --test terminal_snapshots

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runs_on: ubuntu-latest
            os: linux
            target: x86_64-unknown-linux-musl
            suffix: linux-x86_64-musl
            binary_name: terminai
          - name: macOS x86_64
            runs_on: macos-15-intel
            os: unix
            target: x86_64-apple-darwin
            suffix: darwin-x86_64
            binary_name: terminai
          - name: macOS arm64
            runs_on: macos-14
            os: unix
            target: aarch64-apple-darwin
            suffix: darwin-aarch64
            binary_name: terminai
          - name: Windows x86_64
            runs_on: windows-latest
            os: windows
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            binary_name: terminai.exe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin terminai
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: terminai-${{ matrix.suffix }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          if-no-files-found: error
          retention-days: 14
