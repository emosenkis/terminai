# Terminai Configuration Example
# Copy this file to ~/.config/terminai/terminai.yaml and customize
interface:
  chat-position: bottom
  chat-height-percent: 50
  guest-display: resize
  key_bindings:
    activate-overlay: Ctrl-Space
    deactivate-overlay: Ctrl-Space
    approve: y
    deny: n
    layout-mode: F9
    control-panel: F10
    toggle-fullscreen: F11
    request-completion: BackTab
    accept-completion: [Right, End]
    dismiss-completion: Esc
    next-completion: [Tab, Down]
    previous-completion: [BackTab, Up]
# DANGER: auto-approval sends every AI suggestion directly to the shell.
approval-mode: always-ask
# Configure manual and prompt-pause AI ghost-text suggestions.
auto-completion:
  on-hotkey: true
  on-prompt-pause: false
  delay-ms: 750
  agent:
    preset: codex
  agents: {}
agent:
  preset: codex
  # extra-args:
  #   - --model
  #   - gpt-5
agent-presets: {}

# Example: extend a bundled preset.
# codex-fast:
#   extends: codex
#   show-in-switcher: true
#   extra-args:
#     - --model
#     - gpt-5

# Example: choose a separate model for command completion.
# auto-completion:
#   agent:
#     preset: codex-fast
#   agents:
#     codex-fast:
#       extends: codex
#       extra-args: [--model, gpt-5-mini]
